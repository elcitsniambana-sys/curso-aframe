<!DOCTYPE html>
<!-- SOLUÇÃO — Exercício 3: Painel de controle interativo -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solução 3 · Interatividade — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    // Componente genérico: cada clique emite, no alvo, ora o eventoA, ora o eventoB.
    AFRAME.registerComponent('alternar', {
      schema: {
        alvo:    { type: 'selector' },
        eventoA: { type: 'string', default: 'a' },
        eventoB: { type: 'string', default: 'b' }
      },
      init: function () {
        this.estado = false;
        this.el.addEventListener('click', () => {
          this.estado = !this.estado;
          this.data.alvo.emit(this.estado ? this.data.eventoA : this.data.eventoB);
        });
      }
    });

    // Desafio: alterna a visibilidade de um alvo.
    AFRAME.registerComponent('alternar-visibilidade', {
      schema: { alvo: { type: 'selector' } },
      init: function () {
        this.el.addEventListener('click', () => {
          var alvo = this.data.alvo;
          alvo.setAttribute('visible', !alvo.getAttribute('visible'));
        });
      }
    });
  </script>
</head>
<body>
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clicavel" background="color: #F1F5F9">
    <a-assets>
      <a-asset-item id="hubble" src="../../assets/modelos/hubble.glb"></a-asset-item>
      <audio id="bip" src="../../assets/sons/bip.wav" preload="auto"></audio>
    </a-assets>

    <a-mixin id="realce"
             animation__entra="property: scale; to: 1.2 1.2 1.2; dur: 150; startEvents: mouseenter"
             animation__sai="property: scale; to: 1 1 1; dur: 150; startEvents: mouseleave"></a-mixin>
    <a-mixin id="rotulo" text="font: ../../assets/fontes/dejavu-pt-sdf.json; align: center; width: 1; wrapCount: 14; color: #0F172A"></a-mixin>

    <a-entity camera look-controls wasd-controls position="0 1.6 1.5">
      <a-cursor raycaster="objects: .clicavel" color="#0F172A"></a-cursor>
    </a-entity>

    <!-- O modelo fica dentro de um grupo: a escala é animada no grupo,
         sem conflitar com a escala própria do modelo (0,003). -->
    <a-entity id="grupo" position="0 2.3 -3.5"
              animation__crescer="property: scale; to: 2 2 2; dur: 400; easing: easeOutBack; startEvents: crescer"
              animation__encolher="property: scale; to: 1 1 1; dur: 400; easing: easeOutBack; startEvents: encolher">
      <a-entity id="modelo" gltf-model="#hubble" scale="0.003 0.003 0.003"
                animation__girar="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;
                                pauseEvents: pausar; resumeEvents: continuar"></a-entity>
    </a-entity>

    <a-box position="0 0.45 -1.2" width="2.1" height="0.9" depth="0.5" color="#475569"></a-box>

    <a-box class="clicavel" mixin="realce" position="-0.75 0.95 -1.2" width="0.3" height="0.1" depth="0.3" color="#2563EB"
           alternar="alvo: #modelo; eventoA: pausar; eventoB: continuar"></a-box>
    <a-box class="clicavel" mixin="realce" position="-0.25 0.95 -1.2" width="0.3" height="0.1" depth="0.3" color="#16A34A"
           alternar="alvo: #grupo; eventoA: crescer; eventoB: encolher"></a-box>
    <a-box class="clicavel" mixin="realce" position="0.25 0.95 -1.2" width="0.3" height="0.1" depth="0.3" color="#EA580C"
           sound="src: #bip; on: click; poolSize: 4"></a-box>
    <a-box class="clicavel" mixin="realce" position="0.75 0.95 -1.2" width="0.3" height="0.1" depth="0.3" color="#9333EA"
           alternar-visibilidade="alvo: #grupo"></a-box>

    <a-entity mixin="rotulo" position="-0.75 1.15 -1.2" text="value: girar"></a-entity>
    <a-entity mixin="rotulo" position="-0.25 1.15 -1.2" text="value: tamanho"></a-entity>
    <a-entity mixin="rotulo" position="0.25 1.15 -1.2"  text="value: som"></a-entity>
    <a-entity mixin="rotulo" position="0.75 1.15 -1.2"  text="value: mostrar"></a-entity>

    <a-plane rotation="-90 0 0" width="10" height="10" color="#CBD5E1"></a-plane>
    <a-entity light="type: hemisphere; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="1 3 2"></a-entity>
  </a-scene>
</body>
</html>
