<!DOCTYPE html>
<!-- EXERCÍCIO 4 · Opção B — Marcador Hiro com AR.js. Funciona em Android e iPhone.
     Atenção: AR.js 3.4.x → A-Frame 1.6.0 (não misture versões!). -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ex. 4 · Opção B (marcador) — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script src="../../js/curso-utilitarios.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false"
           xr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true"
           gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/">
    <a-assets timeout="30000">
      <!-- TODO: troque pelo seu arquivo -->
      <a-asset-item id="meu-modelo" src="../../assets/modelos/raposa.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" smooth="true">
      <!-- TODO: altura em "lados de marcador" (1 = do tamanho do marcador) -->
      <a-entity gltf-model="#meu-modelo" ajustar-tamanho="altura: 1"></a-entity>
      <!-- TODO (opcional): um texto sobre o modelo -->
    </a-marker>

    <a-entity light="type: hemisphere; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="1 2 1"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
