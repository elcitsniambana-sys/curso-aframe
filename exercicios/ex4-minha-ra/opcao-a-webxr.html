<!DOCTYPE html>
<!-- EXERCÍCIO 4 · Opção A — RA sem marcador (WebXR hit-test). Android/Chrome com ARCore ou Meta Quest. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ex. 4 · Opção A (WebXR) — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="../../js/curso-utilitarios.js"></script>
</head>
<body>
  <a-scene xr-mode-ui="XRMode: ar"
           webxr="optionalFeatures: hit-test, local-floor, light-estimation"
           ar-hit-test="target: #modelo"
           reflection="directionalLight: #sol">
    <a-assets timeout="30000">
      <!-- TODO: troque pelo seu arquivo (ex.: ../../assets/meus-modelos/meu.glb) -->
      <a-asset-item id="meu-modelo" src="../../assets/modelos/raposa.glb"></a-asset-item>
    </a-assets>

    <a-entity camera look-controls wasd-controls position="0 1.6 2"></a-entity>

    <!-- TODO: altura REAL desejada, em metros -->
    <a-entity id="modelo">
      <a-entity gltf-model="#meu-modelo" ajustar-tamanho="altura: 0.5"></a-entity>
    </a-entity>

    <a-plane hide-on-enter-ar rotation="-90 0 0" width="6" height="6" color="#CBD5E1"></a-plane>
    <a-sky hide-on-enter-ar color="#E2E8F0"></a-sky>
    <a-entity id="sol" light="type: directional; intensity: 1.5" position="1 3 2"></a-entity>
    <a-entity hide-on-enter-ar light="type: hemisphere; intensity: 0.8"></a-entity>
  </a-scene>
</body>
</html>
