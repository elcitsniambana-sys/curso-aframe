<!DOCTYPE html>
<!--
  ============================================================
  EXERCÍCIO 1 — Minha primeira sala virtual   (≈ 15 min)
  ------------------------------------------------------------
  Objetivo: praticar primitivas, transformações, hierarquia, materiais e luz.

  Como trabalhar:
   • Edite este arquivo (no github.dev aperte "." no repositório, ou no VS Code).
   • Salve/commit e recarregue a página publicada (o GitHub Pages leva ~1 min).
   • Use o Inspector (Ctrl + Alt + I) para posicionar objetos "no olho"
     e depois copie os valores de position/rotation para o código.

  Tarefas (faça na ordem; cada TODO tem uma DICA):
   [ ] 1. Três paredes (fundo, esquerda, direita) usando <a-box>.
   [ ] 2. Uma mesa como GRUPO (um <a-entity> pai com tampo + 4 pernas).
   [ ] 3. Pelo menos dois objetos SOBRE a mesa (filhos da mesa!).
   [ ] 4. Uma luminária: luz pontual (point) + uma esfera emissiva no mesmo lugar.
   [ ] 5. Troque o céu cinza pelo céu 360° do curso.
   [ ] 6. Escreva seu nome numa parede com <a-text> (use a fonte com acentos).
   Desafio extra: duplique a mesa com outra rotation e scale.

  A solução está em exercicios/solucoes/ex1.html — tente antes de olhar!
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 1 · Minha sala — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="madeira" src="../../assets/texturas/madeira.jpg">
      <img id="tijolos" src="../../assets/texturas/tijolos.jpg">
      <img id="xadrez"  src="../../assets/texturas/xadrez.png">
      <img id="ceu"     src="../../assets/ceu/ceu-360.jpg">
    </a-assets>

    <a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>

    <!-- Piso (pronto): 8 m × 8 m -->
    <a-plane rotation="-90 0 0" width="8" height="8" material="src: #xadrez; repeat: 4 4"></a-plane>

    <!-- TODO 1: paredes.
         DICA: uma parede de fundo com 8 m de largura, 3 m de altura e 0,2 m de espessura,
         a 4 m de distância, apoiada no chão:
         <a-box position="0 1.5 -4" width="8" height="3" depth="0.2" material="src: #tijolos; repeat: 4 2"></a-box>
         Para as laterais, gire 90° em Y (rotation="0 90 0") e mude o X para ±4. -->


    <!-- TODO 2 e 3: mesa (grupo) com objetos em cima.
         DICA: <a-entity id="mesa" position="0 0 -2"> … filhos … </a-entity>
         Tampo: <a-box position="0 0.75 0" width="1.6" height="0.06" depth="0.8" material="src: #madeira"></a-box>
         Pernas: caixas finas (0.06 × 0.72 × 0.06) em x = ±0.75, z = ±0.35, y = 0.36.
         Objetos sobre o tampo: y ≈ 0.78 + metade da altura do objeto. -->


    <!-- TODO 4: luminária.
         DICA: <a-entity light="type: point; intensity: 3; distance: 6; color: #FFD9A8" position="0 2.6 -2"></a-entity>
               <a-sphere position="0 2.6 -2" radius="0.1" material="shader: flat; color: #FFD9A8"></a-sphere> -->


    <!-- TODO 5: troque o céu. DICA: <a-sky src="#ceu"></a-sky> -->
    <a-sky color="#9CA3AF"></a-sky>

    <!-- TODO 6: seu nome.
         DICA: <a-text value="Sala de Fulana" font="../../assets/fontes/dejavu-pt-sdf.json"
                       position="0 2.2 -3.88" align="center" width="5" color="#FFFFFF"></a-text> -->


    <!-- Luz ambiente (pronta). Ao declarar luzes, as luzes padrão do A-Frame são desligadas. -->
    <a-entity light="type: hemisphere; intensity: 0.7"></a-entity>
  </a-scene>
</body>
</html>
