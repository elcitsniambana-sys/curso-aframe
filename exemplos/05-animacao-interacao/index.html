<!DOCTYPE html>
<!--
  ============================================================
  CURSO A-FRAME · Exemplo 05 — Animação e interação
  ------------------------------------------------------------
  Conceitos:
   • Componente animation: property, from/to, dur, easing, loop, dir, startEvents.
     Várias animações na mesma entidade: animation__nome1, animation__nome2…
   • cursor + raycaster: o "ponteiro" 3D.
       - No desktop: cursor="rayOrigin: mouse" no <a-scene> (clique com o mouse).
       - No celular/óculos: <a-cursor> preso à câmera (clique "olhando" — fuse).
       - raycaster="objects: .clicavel" limita o teste a quem tem a classe → desempenho!
   • Eventos: mouseenter, mouseleave, click (gerados pelo cursor) e eventos
     personalizados com el.emit('nome').
   • Som posicional: componente sound (on: click).
   • JavaScript "comum" do DOM: querySelector, addEventListener, setAttribute.
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Animação e interação — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    .voltar { position: fixed; top: 12px; left: 12px; z-index: 10; font: 600 14px system-ui, sans-serif;
              background: rgba(17,24,39,.85); color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <a class="voltar" href="../../index.html">← Índice do curso</a>

  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clicavel" background="color: #E5E7EB">

    <a-assets>
      <audio id="bip" src="../../assets/sons/bip.wav" preload="auto"></audio>
    </a-assets>

    <!-- Mixins: "estilos" reaproveitáveis -->
    <a-mixin id="rotulo" text="font: ../../assets/fontes/dejavu-pt-sdf.json; align: center; width: 1.4; wrapCount: 20; color: #111827"></a-mixin>
    <a-mixin id="realce"
             animation__entra="property: scale; to: 1.15 1.15 1.15; dur: 200; startEvents: mouseenter"
             animation__sai="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"></a-mixin>

    <!-- Câmera com cursor de olhar (fuse automático em celulares: segure o olhar ~1,5 s) -->
    <a-entity camera look-controls wasd-controls position="0 1.6 1.5">
      <a-cursor raycaster="objects: .clicavel" fuse-timeout="1500" color="#111827"
                animation__fusing="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1500; startEvents: fusing"
                animation__reset="property: scale; to: 1 1 1; dur: 100; startEvents: mouseleave"></a-cursor>
    </a-entity>

    <a-plane rotation="-90 0 0" width="12" height="12" color="#CBD5E1"></a-plane>

    <!-- 1) Animação contínua (loop infinito, sem eventos) -->
    <a-box position="-3 1 -3" color="#4F46E5"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    <a-entity mixin="rotulo" position="-3 2.1 -3" text="value: 1) Gira sempre\nloop: true"></a-entity>

    <!-- 2) Reage a passar o mouse/olhar por cima (mouseenter / mouseleave) -->
    <a-sphere class="clicavel" mixin="realce" position="-1.5 1 -3" radius="0.5" color="#10B981"></a-sphere>
    <a-entity mixin="rotulo" position="-1.5 2.1 -3" text="value: 2) Passe o cursor\nmouseenter / mouseleave"></a-entity>

    <!-- 3) Botão que muda a cor de outro objeto (JavaScript do DOM) + som -->
    <a-box id="botao-cor" class="clicavel" mixin="realce" position="0 0.6 -3" width="0.6" height="0.25" depth="0.6"
           color="#EF4444" sound="src: #bip; on: click; poolSize: 4"></a-box>
    <a-icosahedron id="alvo-cor" position="0 1.35 -3" radius="0.35" color="#F59E0B"
                   animation="property: rotation; to: 360 360 0; loop: true; dur: 9000; easing: linear"></a-icosahedron>
    <a-entity mixin="rotulo" position="0 2.1 -3" text="value: 3) Clique no botão vermelho\n(muda a cor + som)"></a-entity>
    <a-entity id="contador" mixin="rotulo" position="0 0.25 -2.5" text="value: Cliques: 0"></a-entity>

    <!-- 4) Cilindro que pula ao ser clicado (animação disparada por evento) -->
    <a-cylinder class="clicavel" mixin="realce" position="1.5 0.4 -3" radius="0.3" height="0.8" color="#0EA5E9"
                animation__pulo="property: position; from: 1.5 0.4 -3; to: 1.5 1.4 -3; dur: 350; easing: easeOutQuad;
                                 dir: alternate; loop: 2; startEvents: click"></a-cylinder>
    <a-entity mixin="rotulo" position="1.5 2.1 -3" text="value: 4) Clique para pular\nstartEvents: click"></a-entity>

    <!-- 5) Porta: a rotação acontece em torno da DOBRADIÇA (um pai vazio na borda da porta). -->
    <a-entity id="dobradica" position="2.6 0 -3.2"
              animation__abrir="property: rotation; to: 0 -100 0; dur: 900; easing: easeInOutCubic; startEvents: abrir"
              animation__fechar="property: rotation; to: 0 0 0; dur: 900; easing: easeInOutCubic; startEvents: fechar">
      <!-- A porta fica deslocada 0,6 m em X: assim a borda esquerda coincide com o pivô. -->
      <a-box id="porta" class="clicavel" position="0.6 1.05 0" width="1.2" height="2.1" depth="0.06" color="#92400E"></a-box>
      <a-sphere position="1.08 1.05 0.06" radius="0.05" color="#FBBF24"></a-sphere>
    </a-entity>
    <a-box position="2.52 1.1 -3.2" width="0.08" height="2.2" depth="0.12" color="#57534E"></a-box>
    <a-box position="3.88 1.1 -3.2" width="0.08" height="2.2" depth="0.12" color="#57534E"></a-box>
    <a-box position="3.2 2.22 -3.2" width="1.44" height="0.08" depth="0.12" color="#57534E"></a-box>
    <a-entity mixin="rotulo" position="3.2 2.6 -3.2" text="value: 5) Clique na porta\nel.emit('abrir' / 'fechar')"></a-entity>

    <a-entity light="type: hemisphere; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.4" position="1 3 2"></a-entity>
  </a-scene>

  <script>
    // ---- 3) Eventos do DOM: o A-Frame é HTML, então addEventListener funciona normalmente ----
    var botao = document.querySelector('#botao-cor');
    var contador = document.querySelector('#contador');
    var cliques = 0;
    botao.addEventListener('click', function () {
      cliques++;
      var cor = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
      document.querySelector('#alvo-cor').setAttribute('material', 'color', cor);
      contador.setAttribute('text', 'value', 'Cliques: ' + cliques + '  ·  cor ' + cor);
    });

    // ---- 5) Porta: alterna entre os eventos personalizados "abrir" e "fechar" ----
    var aberta = false;
    document.querySelector('#porta').addEventListener('click', function () {
      aberta = !aberta;
      document.querySelector('#dobradica').emit(aberta ? 'abrir' : 'fechar');
    });
  </script>
</body>
</html>
