<!DOCTYPE html>
<!--
  ============================================================
  CURSO A-FRAME · Exemplo 07 — Realidade Virtual imersiva
  ------------------------------------------------------------
  Conceitos:
   • Botão "VR" (xr-mode-ui) → sessão WebXR immersive-vr (Meta Quest, Pico, Vision Pro, PC VR).
     Exige HTTPS — por isso publicamos no GitHub Pages.
   • "Rig" (equipamento): uma entidade-pai que carrega câmera e controles juntos.
     Movemos o RIG, nunca a câmera (no óculos, a câmera é controlada pela cabeça).
   • movement-controls (A-Frame Extras): teclado (W A S D), toque, gamepad e
     analógicos dos controles XR, tudo num componente só.
   • checkpoint: "teletransporte" confortável — aponte e clique num disco.
   • laser-controls: raio laser nos controles de qualquer óculos.
   • hand-tracking-grab-controls + grabbable: pegar objetos com a mão (gesto de pinça).
   • environment (componente da comunidade): ambientes prontos com uma linha.
   • Desempenho: acrescente ?stats ao endereço para ver FPS, draw calls e triângulos.
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · RV imersiva — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <!-- Componentes da comunidade (sempre DEPOIS do A-Frame) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.controls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.misc.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  <style>
    .voltar { position: fixed; top: 12px; left: 12px; z-index: 10; font: 600 14px system-ui, sans-serif;
              background: rgba(17,24,39,.85); color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <a class="voltar" href="../../index.html">← Índice do curso</a>

  <a-scene xr-mode-ui="XRMode: vr" renderer="antialias: true; foveationLevel: 1"
           cursor="rayOrigin: mouse" raycaster="objects: .clicavel"
           obb-collider="showColliders: false">

    <a-assets>
      <a-asset-item id="astronauta" src="../../assets/modelos/astronauta.glb"></a-asset-item>
    </a-assets>

    <a-mixin id="rotulo" text="font: ../../assets/fontes/dejavu-pt-sdf.json; align: center; width: 2.4; color: #FFFFFF"></a-mixin>
    <!-- Disco de teletransporte (checkpoint) -->
    <a-mixin id="disco" geometry="primitive: cylinder; radius: 0.45; height: 0.04"
             material="color: #38BDF8; opacity: 0.6; transparent: true; emissive: #0EA5E9; emissiveIntensity: 0.6"
             animation__realce="property: material.opacity; to: 0.95; dur: 150; startEvents: mouseenter"
             animation__normal="property: material.opacity; to: 0.6; dur: 150; startEvents: mouseleave"></a-mixin>

    <!-- 1) Ambiente pronto. Experimente: forest, japan, tron, egypt, dream, starry, volcano… -->
    <a-entity environment="preset: forest; dressingAmount: 60; shadow: true; lightPosition: 1 3 -1"></a-entity>

    <!-- 2) O RIG: tudo que é "o usuário" fica aqui dentro -->
    <a-entity id="rig" position="0 0 3"
              movement-controls="controls: checkpoint, gamepad, trackpad, keyboard, touch; speed: 0.15"
              checkpoint-controls="mode: animate; animateSpeed: 6">
      <!-- A câmera fica 1,6 m acima do chão (altura média dos olhos) -->
      <a-entity id="camera" camera position="0 1.6 0" look-controls>
        <!-- Cursor de olhar para celular / Cardboard -->
        <a-cursor raycaster="objects: .clicavel" fuse-timeout="1500" color="#FFFFFF"></a-cursor>
      </a-entity>
      <!-- Controles dos óculos: raio laser em cada mão -->
      <a-entity laser-controls="hand: left"  raycaster="objects: .clicavel; far: 30; lineColor: #38BDF8"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clicavel; far: 30; lineColor: #38BDF8"></a-entity>
      <!-- Rastreamento de mãos (Quest): pinça para pegar objetos "grabbable" -->
      <a-entity hand-tracking-grab-controls="hand: left;  hoverEnabled: true"></a-entity>
      <a-entity hand-tracking-grab-controls="hand: right; hoverEnabled: true"></a-entity>
    </a-entity>

    <!-- 3) Pontos de teletransporte: aponte (laser/olhar/mouse) e clique -->
    <a-entity class="clicavel" mixin="disco" checkpoint position="0 0.02 0"></a-entity>
    <a-entity class="clicavel" mixin="disco" checkpoint position="-4 0.02 -4"></a-entity>
    <a-entity class="clicavel" mixin="disco" checkpoint position="4 0.02 -4"></a-entity>
    <a-entity class="clicavel" mixin="disco" checkpoint position="0 0.02 -8"></a-entity>

    <!-- 4) Mesa com objetos que podem ser PEGOS com a mão (Quest com hand tracking) -->
    <a-entity position="0 0 -1.2">
      <a-box position="0 0.4 0" width="1.4" height="0.8" depth="0.6" color="#8B5E3C" shadow="cast: true; receive: true"></a-box>
      <a-box grabbable position="-0.45 0.9 0" width="0.12" height="0.12" depth="0.12" color="#EF4444" shadow="cast: true"></a-box>
      <a-box grabbable position="-0.15 0.9 0" width="0.12" height="0.12" depth="0.12" color="#22C55E" shadow="cast: true"></a-box>
      <a-sphere grabbable position="0.15 0.9 0" radius="0.07" color="#3B82F6" shadow="cast: true"></a-sphere>
      <a-cone grabbable position="0.45 0.92 0" radius-bottom="0.07" radius-top="0" height="0.16" color="#F59E0B" shadow="cast: true"></a-cone>
      <a-entity mixin="rotulo" position="0 1.25 0" text="value: Quest: use as mãos (pinça) para pegar os objetos"></a-entity>
    </a-entity>

    <!-- 5) Um "ponto de interesse" para visitar com o teletransporte -->
    <a-entity position="0 0 -9.5">
      <a-entity gltf-model="#astronauta" scale="0.025 0.025 0.025" position="0 0.93 0" shadow="cast: true"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear"></a-entity>
      <a-entity mixin="rotulo" position="0 2.2 0" text="value: Teletransporte até aqui pelos discos azuis"></a-entity>
    </a-entity>

    <!-- Painel de instruções -->
    <a-entity position="-1.8 1.7 0.5" rotation="0 35 0">
      <a-plane width="1.6" height="1" material="color: #0F172A; opacity: 0.85; transparent: true"></a-plane>
      <a-entity mixin="rotulo" position="0 0 0.01"
                text="value: COMO NAVEGAR\n\nPC: W A S D + arrastar o mouse\nCelular: toque para andar · gire o aparelho\nÓculos: analógico ou laser nos discos azuis\n\nAcrescente ?stats ao endereço; width: 1.5; align: left; anchor: center"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Liga o painel de desempenho se o endereço contiver "?stats"
    if (location.search.indexOf('stats') !== -1) {
      document.querySelector('a-scene').setAttribute('stats', '');
    }
  </script>
</body>
</html>
