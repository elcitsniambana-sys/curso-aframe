<!DOCTYPE html>
<!--
  ============================================================
  CURSO A-FRAME · Exemplo 02 — Transformações e hierarquia
  ------------------------------------------------------------
  Conceitos:
   • Sistema de coordenadas destro: X → direita (vermelho), Y ↑ cima (verde),
     Z → em direção ao observador (azul). A câmera nasce em (0, 1.6, 0) olhando para -Z.
   • position (metros), rotation (graus, ordem Euler XYZ), scale (fator).
   • Hierarquia pai → filho: o filho herda as transformações do pai.
     É o "grafo de cena" que vocês já conhecem da Computação Gráfica.
   • <a-entity> vazia como "pivô" (nó de transformação sem geometria).
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · Transformações e hierarquia — Curso A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    .voltar { position: fixed; top: 12px; left: 12px; z-index: 10; font: 600 14px system-ui, sans-serif;
              background: rgba(17,24,39,.85); color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <a class="voltar" href="../../index.html">← Índice do curso</a>

  <a-scene background="color: #0B1020">

    <a-assets>
      <img id="grade" src="../../assets/texturas/grade.png">
    </a-assets>

    <!-- A câmera começa um pouco recuada para enxergarmos tudo. -->
    <a-entity camera look-controls wasd-controls position="0 1.6 2"></a-entity>

    <!-- Piso com textura repetida 10 × 10 vezes (repeat). -->
    <a-plane rotation="-90 0 0" width="20" height="20"
             material="src: #grade; repeat: 10 10; roughness: 1"></a-plane>

    <!-- ===================== 1. EIXOS DE COORDENADAS ===================== -->
    <!-- Um grupo "eixos" na origem. Cada cilindro é deitado/girado para virar um eixo. -->
    <a-entity id="eixos" position="-3 0.01 -3">
      <a-cylinder radius="0.02" height="1" position="0.5 0 0" rotation="0 0 -90" color="#EF4444"></a-cylinder>
      <a-cylinder radius="0.02" height="1" position="0 0.5 0"                   color="#22C55E"></a-cylinder>
      <a-cylinder radius="0.02" height="1" position="0 0 0.5" rotation="90 0 0" color="#3B82F6"></a-cylinder>
      <a-text value="X" position="1.1 0 0"   color="#EF4444" font="../../assets/fontes/dejavu-pt-sdf.json" width="4" align="center"></a-text>
      <a-text value="Y" position="0 1.15 0"  color="#22C55E" font="../../assets/fontes/dejavu-pt-sdf.json" width="4" align="center"></a-text>
      <a-text value="Z" position="0 0 1.15"  color="#3B82F6" font="../../assets/fontes/dejavu-pt-sdf.json" width="4" align="center"></a-text>
    </a-entity>

    <!-- ===================== 2. UMA MESA = GRUPO DE CAIXAS ===================== -->
    <!-- O pai "mesa" define onde a mesa inteira fica. Os filhos são posicionados
         EM RELAÇÃO AO PAI (coordenadas locais). Mova o pai e tudo vai junto. -->
    <a-entity id="mesa" position="0 0 -3">
      <a-box position="0 0.75 0"        width="1.6" height="0.06" depth="0.8" color="#B7791F"></a-box> <!-- tampo -->
      <a-box position="-0.75 0.36 -0.35" width="0.06" height="0.72" depth="0.06" color="#744210"></a-box>
      <a-box position=" 0.75 0.36 -0.35" width="0.06" height="0.72" depth="0.06" color="#744210"></a-box>
      <a-box position="-0.75 0.36  0.35" width="0.06" height="0.72" depth="0.06" color="#744210"></a-box>
      <a-box position=" 0.75 0.36  0.35" width="0.06" height="0.72" depth="0.06" color="#744210"></a-box>
    </a-entity>

    <!-- Segunda mesa: os MESMOS filhos, mas o pai tem rotation (30° em Y) e scale (metade).
         Repare que as pernas giram e encolhem junto, sem mexermos nelas. -->
    <!-- Dica: para não repetir atributos, o A-Frame tem <a-mixin> (ver exemplo 05). -->
    <a-entity id="mesa-pequena" position="2.5 0 -3" rotation="0 30 0" scale="0.5 0.5 0.5">
      <a-box position="0 0.75 0"        width="1.6" height="0.06" depth="0.8" color="#2B6CB0"></a-box>
      <a-box position="-0.75 0.36 -0.35" width="0.06" height="0.72" depth="0.06" color="#1A365D"></a-box>
      <a-box position=" 0.75 0.36 -0.35" width="0.06" height="0.72" depth="0.06" color="#1A365D"></a-box>
      <a-box position="-0.75 0.36  0.35" width="0.06" height="0.72" depth="0.06" color="#1A365D"></a-box>
      <a-box position=" 0.75 0.36  0.35" width="0.06" height="0.72" depth="0.06" color="#1A365D"></a-box>
    </a-entity>

    <!-- ===================== 3. SISTEMA SOLAR (pivôs que giram) ===================== -->
    <!-- Truque clássico de grafo de cena: para um objeto ORBITAR, giramos um pai vazio (pivô)
         e deslocamos o filho para longe do centro. A Lua orbita a Terra porque o pivô
         dela é filho da Terra. -->
    <a-entity id="sistema-solar" position="0 2.2 -6">
      <a-sphere id="sol" radius="0.5" material="color: #FDB813; emissive: #FDB813; emissiveIntensity: 0.9"></a-sphere>
      <a-entity light="type: point; intensity: 2; distance: 12; decay: 1"></a-entity>

      <!-- pivô da Terra: gira 360° em 12 s -->
      <a-entity id="pivo-terra" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        <a-entity position="2 0 0">
          <a-sphere id="terra" radius="0.22" color="#3B82F6"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear"></a-sphere>
          <!-- pivô da Lua: filho do grupo da Terra -->
          <a-entity id="pivo-lua" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
            <a-sphere id="lua" radius="0.07" position="0.45 0 0" color="#CBD5E1"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Legendas -->
    <a-text value="Eixos: X vermelho · Y verde · Z azul" position="-3 1.5 -3" align="center" width="3.5"
            color="#E5E7EB" font="../../assets/fontes/dejavu-pt-sdf.json"></a-text>
    <a-text value="Hierarquia: a mesa é um grupo; a azul é a mesma estrutura com rotation e scale"
            position="1.2 1.3 -3" align="center" width="4" color="#E5E7EB" font="../../assets/fontes/dejavu-pt-sdf.json"></a-text>
    <a-text value="Grafo de cena: Sol → pivô → Terra → pivô → Lua" position="0 3.3 -6" align="center" width="5"
            color="#FDE68A" font="../../assets/fontes/dejavu-pt-sdf.json"></a-text>

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1.2" position="2 4 3"></a-entity>
  </a-scene>
</body>
</html>
